services:
  api:
    build: .
    container_name: netmarket
    networks:
      - netmarket-net
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://netmarket:netmarket123@netmarket-postgres:5432/netdb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    networks:
      - netmarket-net
    container_name: netmarket-postgres
    environment:
      POSTGRES_USER: netmarket
      POSTGRES_PASSWORD: netmarket123
      POSTGRES_DB: netdb
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netmarket -d netdb']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:7
    container_name: netmarket-redis
    command: redis-server --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    networks:
      - netmarket-net
    restart: always

volumes:
  postgres_data:

networks:
  netmarket-net:
    driver: bridge
